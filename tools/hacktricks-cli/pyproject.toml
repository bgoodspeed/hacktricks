[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hacktricks-cli"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "rich>=13.0"]

[project.scripts]
hacktricks = "hacktricks_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hacktricks_cli"]

[tool.hatch.build.targets.wheel.shared-data]
"src/hacktricks_cli/data" = "hacktricks_cli/data"
